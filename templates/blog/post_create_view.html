{% extends "../base.html" %}
{% block title %}
    Post Create View
{% endblock %}

{% block content %}
    {% if user.is_authenticated %}
    <h1>Post Create View</h1>
    <form method="post">
        {% csrf_token %}
        <table>
        {{ form.as_table }}
        </table>
        <button class="btn btn-primary" type="submit">Create</button>
    </form>
    {% else %}
        <p>You are not logged in
            <a href="{% url 'login' %}">Login</a>
        </p>
    {% endif %}
{% endblock %}
